{% extends 'base.html' %}
{% block title %}{{ t('farm.add') }}{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">{% endblock %}
{% block content %}
<h1>{{ t('farm.add') }}</h1>
<form method="post" class="card">
  <div class="grid g2">
    <div>
      <div class="field"><label>{{ t('farm.name') }}</label><input name="name" required placeholder="{{ t('farm.name_ph') }}"></div>
      <div class="grid g2">
        <div class="field"><label>{{ t('form.village') }}</label><input name="village"></div>
        <div class="field"><label>{{ t('form.district') }}</label><input name="district" value="{{ user.district or '' }}"></div>
      </div>
      <div class="grid g2">
        <div class="field"><label>{{ t('farm.crop') }}</label>
          <select name="crop" required>{% for k, c in CROPS.items() %}<option value="{{ k }}">{{ crop_name(k) }}</option>{% endfor %}</select></div>
        <div class="field"><label>{{ t('farm.variety') }}</label><input name="variety"></div>
      </div>
      <div class="grid g2">
        <div class="field"><label>{{ t('farm.resistance') }}</label>
          <select name="resistance"><option value="S">{{ t('res.S') }}</option><option value="MR">{{ t('res.MR') }}</option><option value="R">{{ t('res.R') }}</option></select></div>
        <div class="field"><label>{{ t('farm.sowing') }}</label><input type="date" name="sowing_date" max="{{ today }}"></div>
      </div>
      <div class="grid g2">
        <div class="field"><label>{{ t('farm.area') }}</label><input type="number" step="0.1" min="0" name="area_acres"></div>
        <div class="field"><label>{{ t('farm.soil') }}</label>
          <select name="soil_type">{% for s in ['black','red','alluvial','laterite','sandy','loamy'] %}<option value="{{ s }}">{{ t('soil.' ~ s) }}</option>{% endfor %}</select></div>
      </div>
      <div class="grid g2">
        <div class="field"><label>{{ t('farm.drainage') }}</label>
          <select name="drainage">{% for s in ['good','moderate','poor'] %}<option value="{{ s }}" {{ 'selected' if s=='moderate' }}>{{ t('drain.' ~ s) }}</option>{% endfor %}</select></div>
        <div class="field"><label>{{ t('farm.irrigation') }}</label>
          <select name="irrigation">{% for s in ['drip','flood','sprinkler','rainfed'] %}<option value="{{ s }}">{{ t('irr.' ~ s) }}</option>{% endfor %}</select></div>
      </div>
    </div>
    <div>
      <label>{{ t('farm.location') }}</label>
      <div id="pick-map"></div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn small secondary" onclick="locate()">📍 {{ t('farm.use_gps') }}</button>
        <span class="hint">{{ t('farm.click_map') }}</span>
      </div>
      <div class="grid g2" style="margin-top:8px">
        <div class="field"><label>Latitude</label><input name="lat" id="lat" required step="any" type="number"></div>
        <div class="field"><label>Longitude</label><input name="lon" id="lon" required step="any" type="number"></div>
      </div>
    </div>
  </div>
  <button class="btn big">{{ t('common.save') }}</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script>
  const map = L.map('pick-map').setView([19.2, 76.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '© OpenStreetMap'}).addTo(map);
  let mk = null;
  function setPt(lat, lon, zoom) {
    document.getElementById('lat').value = lat.toFixed(5);
    document.getElementById('lon').value = lon.toFixed(5);
    if (mk) mk.setLatLng([lat, lon]); else mk = L.marker([lat, lon]).addTo(map);
    if (zoom) map.setView([lat, lon], zoom);
  }
  map.on('click', e => setPt(e.latlng.lat, e.latlng.lng));
  function locate() {
    if (!navigator.geolocation) return alert('GPS not available');
    navigator.geolocation.getCurrentPosition(p => setPt(p.coords.latitude, p.coords.longitude, 14),
      () => alert('{{ t("farm.gps_fail") }}'));
  }
</script>
{% endblock %}
