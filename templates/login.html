{% extends 'base.html' %}
{% block title %}{{ t('nav.login') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto">
  <h1>{{ t('login.title') }}</h1>
  <form method="post">
    <div class="field"><label>{{ t('form.username') }}</label><input name="username" required autofocus autocomplete="username"></div>
    <div class="field"><label>{{ t('form.password') }}</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn" style="width:100%">{{ t('nav.login') }}</button>
  </form>
  <p class="muted" style="margin-top:14px">{{ t('login.new') }} <a href="{{ url_for('register') }}">{{ t('nav.register') }}</a></p>
  <p class="hint">{{ t('login.demo') }}</p>
</div>
{% endblock %}
