{% extends 'base.html' %}
{% block title %}{{ t('nav.register') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:24px auto">
  <h1>{{ t('register.title') }}</h1>
  <form method="post">
    <div class="field"><label>{{ t('form.name') }}</label><input name="name" required></div>
    <div class="grid g2">
      <div class="field"><label>{{ t('form.username') }}</label><input name="username" required autocomplete="username"></div>
      <div class="field"><label>{{ t('form.password') }}</label><input name="password" type="password" minlength="6" required autocomplete="new-password"></div>
    </div>
    <div class="grid g2">
      <div class="field"><label>{{ t('form.phone') }}</label><input name="phone" inputmode="tel"></div>
      <div class="field"><label>{{ t('form.district') }}</label><input name="district"></div>
    </div>
    <button class="btn" style="width:100%">{{ t('register.submit') }}</button>
  </form>
</div>
{% endblock %}
